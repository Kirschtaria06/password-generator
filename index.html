<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="box">
        <div class="content-box">
            <h2>Generate a <br><span>random password</span></h2>
            <p class="subtext">Never use an insecure password again.</p>
            <div id="checkbox-label">
                <label for="checkbox">Select preferred password parameters:</label>
            </div>
            <form id="checkbox">
                <div class="groupCheckBox">
                    <div>
                        <input type="checkbox" id="lowercase" name="include" value="lowercase">
                        <label for="lowercase">Lowercase</label>
                    </div>
                    <div>
                        <input type="checkbox" id="uppercase" name="include" value="uppercase">
                        <label for="lowercase">Uppercase</label>
                    </div>
                </div>
                <div class="groupCheckBox">
                    <div>
                        <input type="checkbox" id="symbols" name="include" value="symbols">
                        <label for="lowercase">Symbols</label>
                    </div>
                    <div>
                        <input type="checkbox" id="numbers" name="include" value="numbers">
                        <label for="lowercase">Numbers</label>
                    </div>
                </div>
            </form>
            <button id="generate-pass" onclick="generatePassword()">Generate passwords</button>
            <div class="generated-box">
                <p id="pass-1"></p>
                <p id="pass-2"></p>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
